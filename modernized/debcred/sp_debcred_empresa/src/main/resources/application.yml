spring:
  application:
    name: sp-debcred-empresa
  # No default datasource: the ASE connection is built by AseSessionFactory under the "ase" profile
  # from the properties below, and PostgreSQL (the service's own state, brief 7-A3) is a later phase.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

  # Architecture review H4: a misspelled key among the 45 must be a 400, never a silent NULL that the
  # RULE-037 defaults then turn into a different debit.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
  # mTLS (brief section 7 A21, harden JSEC-001): HTTPS only, and every caller must present a client
  # certificate signed by the trust store's CA. Without a key store the service does not start (fail closed).
  ssl:
    enabled: true
    client-auth: need
    key-store: ${DEBCRED_TLS_KEYSTORE:}
    key-store-password: ${DEBCRED_TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${DEBCRED_TLS_KEYSTORE_TYPE:PKCS12}
    trust-store: ${DEBCRED_TLS_TRUSTSTORE:}
    trust-store-password: ${DEBCRED_TLS_TRUSTSTORE_PASSWORD:}
    trust-store-type: ${DEBCRED_TLS_TRUSTSTORE_TYPE:PKCS12}

# Sybase ASE with the COBIS procedures and tables. Values come from the environment; nothing here
# is a credential. cobis-database: the home of the legacy's unqualified names (brief 7-A8).
# URL template (review Phase 4 M4; to confirm on the bank's test ASE): the reads run inside
# `begin tran`, so do not let jTDS create temporary procedures, and bind text as varchar like the legacy:
#   jdbc:jtds:sybase://<host>:<port>/<db>;prepareSQL=0;sendStringParametersAsUnicode=false
debcred:
  security:
    # CN of each COBIS caller's client certificate, comma separated, matched exactly. Empty: nobody.
    allowed-callers: ${DEBCRED_ALLOWED_CALLERS:}
  ase:
    url: ${DEBCRED_ASE_URL:}
    username: ${DEBCRED_ASE_USERNAME:}
    password: ${DEBCRED_ASE_PASSWORD:}
    cobis-database: ${DEBCRED_ASE_COBIS_DATABASE:cobis}
