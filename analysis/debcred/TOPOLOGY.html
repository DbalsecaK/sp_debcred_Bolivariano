<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

ription": "Node B7 Notifications (sp_debcred_empresa.sp lines 746-1256) runs inside the transaction after a successful debit (@w_return = 0) for any service other than PAGOPRV: it maps the channel (DIR/SAT to SAT, BNK to IBK \"24OnLine\", VEN to \"Ventanilla\"), looks up the SMS service in ad_servicios_sms, resolves the beneficiary company, credit account and product (CTE, AHO, CON, ESP) for TRANSWIFT, TRANSCLI, TARJCRED or COMEXT, then sends the notification. It reads ba_tabla, bp_orden, bp_orden_his, bp_detalle, bp_detalle_his, cc_ctacte, ah_cuenta and vi_cuenta; calls pa_sat_pnotificacion and sp_eventos; is called from B6 and calls B9."}, {"id": "B8", "name": "B8 Accounting account (type 9)", "kind": "module", "language": "tsql-sybase", "loc": 24, "file": "sp_debcred_empresa.sp", "lines": "1260-1322", "description": "Node B8 \"Accounting account (type 9)\" handles the debit when the company account type @i_tipcta_emp is 9 (Contable): it copies @i_valor_debito into @v_valor_debito, and for company '1295' with service 'SPI' moves the amount into @v_saldo_ap and zeroes @i_valor_debito (REF 45 JPI); any other type sets error 122001, since only Corriente (3), Ahorros (4) or Contable (9) are allowed. It calls db_biz_pagos..sp_graba_tran_servicio (line 1284), storing the return in @w_cod_errord; it is called from B4 begin tran + savepoint and flows to B9 Debit outcome and movement record."}, {"id": "B9", "name": "B9 Debit outcome and movement record", "kind": "module", "language": "tsql-sybase", "loc": 66, "file": "sp_debcred_empresa.sp", "lines": "1332-1492", "description": "Node B9 records the company-account debit outcome inside the transaction: it sets process status 'P', or rolls back to savepoint and marks 'X' when a debit error code exists; for service 'SPI' with affectation type '12' it resolves the originating service and disables total-order updating. It reads db_biz_pagos..bp_orden and db_sat_his..bp_orden_his, calls sp_grb_mov_y_frmpgo to write the movement and payment form (error 122002 exits via B15 lbl_error), commits and returns on debit error, else proceeds to B10 Commission debit or B14 Success exit; called from B7 Notifications and B8 Accounting account."}, {"id": "B10", "name": "B10 Commission debit", "kind": "module", "language": "tsql-sybase", "loc": 100, "file": "sp_debcred_empresa.sp", "lines": "1500-1732", "description": "Node B10 (Commission debit, sp_debcred_empresa.sp lines 1500-1732) charges the company account for the service commission inside the transaction: for TRANSQUICK it substitutes @i_frm_pagcob_spi as the payment form, for TRANSBIMO it sets @i_valor_tarifa to @i_valor_comision, and when @i_valor_comision > 0 it calls sp_grb_comision (line 1518) with reference 'COBRO DE COMISION'. On failure it sets error 122003 (or @w_cod_errord), marks status 'X', rolls back, calls sp_grb_mov_y_frmpgo (line 1628) to record the failed movement, and returns @o_error; otherwise a nonzero @w_cod_errord commits and returns. It is called from B9 and proceeds to B11."}, {"id": "B11", "name": "B11 Second SWIFT commission", "kind": "module", "language": "tsql-sybase", "loc": 53, "file": "sp_debcred_empresa.sp", "lines": "1742-1856", "description": "Node B11 \"Second SWIFT commission\" (sp_debcred_empresa.sp lines 1742-1856) applies a second SWIFT commission charge only when @i_valor2_swift is greater than 0 and @i_servicio equals 'TRANSWIFT', debiting the company account for that fee with @i_tipoafec = '16'. It is called from B10 Commission debit and calls sp_grb_comision (line 1746) with @i_valor_comision and @i_valor_tarifa set to @i_valor2_swift; on failure it sets @w_num_error = 122003 (or @w_cod_errord) and goes to B15 lbl_error, or commits and returns @o_error; otherwise flow continues to B12 Order-state update."}, {"id": "B12", "name": "B12 Order-state update", "kind": "module", "language": "tsql-sybase", "loc": 98, "file": "sp_debcred_empresa.sp", "lines": "1876-2090", "description": "Node B12 (Order-state update, sp_debcred_empresa.sp lines 1876-2090) marks the payment order as processed after the debit: for channels DIR, SFR, FR2, BTH or VEN it branches on @i_opcion ('01', '02', '03'), otherwise handles forms COB, TRC, CTB, CPD, TPD, setting te_estado_proceso to 'T' and te_codigo_error from @w_cod_errord where state is 'I'. It writes db_biz_pagos..bp_total_orden, falling back to db_sat_his..bp_total_orden_his when @@rowcount is zero; if nothing updates and @w_act_totord = 'S' (service not in TRANSWIFT, IMPADUAN, PAGIESS, TRANSQUICK, TRANSBIMO, PAGOPRV), it raises error 122004. Called from B11; calls B14 or B15 (lbl_error)."}, {"id": "B13", "name": "B13 Commented ROLPAGO update", "kind": "module", "language": "tsql-sybase", "loc": 11, "file": "sp_debcred_empresa.sp", "lines": "2098-2124", "description": "Node B13, \"Commented ROLPAGO update\" (sp_debcred_empresa.sp lines 2098-2124), is dead code: the entire block is inside a /* */ comment, so it performs no business action today. As written, it would have set the payment start date (or_fch_inicio_pagcob = @i_fecha_proceso) on bp_orden rows matching @i_orden and @i_servicio when @i_servicio = 'ROLPAGO', raising error 122005 via goto lbl_error on failure. The packet lists no connections: nothing it calls, reads, writes, or is called by."}, {"id": "B14", "name": "B14 Success exit", "kind": "module", "language": "tsql-sybase", "loc": 3, "file": "sp_debcred_empresa.sp", "lines": "2130-2136", "description": "Node B14 (\"B14 Success exit\", inside the transaction) is the successful completion point of sp_debcred_empresa: it commits the open transaction with `commit tran` (line 2130), normalises the output error parameter with `select @o_error = isnull(@o_error, 0)` (line 2134) so callers receive 0 rather than null, and exits with `return 0` (line 2136). It calls, reads or writes nothing else; it is reached by calls from B9 (Debit outcome and movement record) and B12 (Order-state update). The packet is thin, so no further behaviour can be supported."}]}, {"id": "dom:err", "name": "Error exit", "kind": "domain", "children": [{"id": "B15", "name": "B15 lbl_error exit", "kind": "module", "language": "tsql-sybase", "loc": 15, "file": "sp_debcred_empresa.sp", "lines": "2140-2170", "description": "Node B15 is the shared error exit (label lbl_error, sp_debcred_empresa.sp lines 2140-2170) of the company-account debit: when any step fails it undoes the pending transaction (rollback tran if @@trancount > 0) and reports the failure code @w_num_error. If @i_aplcobis = 'S' it calls cobis..sp_cerror with @t_from = @i_sp_name and returns @w_num_error; otherwise it sets @o_error and returns 0. It is called from B3, B5, B9, B11 and B12, and calls only sp_cerror."}]}, {"id": "dom:procs", "name": "External procedures (Sybase, not in tree)", "kind": "domain", "children": [{"id": "sp:pa_sat_pnotificacion", "name": "pa_sat_pnotificacion", "kind": "module", "language": "tsql-sybase", "loc": 1, "file": "(not in tree: db_biz_pagos..pa_sat_pnotificacion)", "database": "db_biz_pagos", "description": "pa_sat_pnotificacion is an external procedure in db_biz_pagos whose source is not in the tree; only its call site is known. Judging from its arguments (@i_canal, @i_servicio, @i_orden_banco, @i_secuencial, debit account @i_ctadebito/@i_tipctadeb, credit account @i_ctacred/@i_prod_cre, @i_nombrecred, @i_valor, @i_comision, @i_empresa, @i_direccion_transf) and its outputs (@o_error, @o_msg), it appears to send a notification of a completed payment-order debit/credit. It is called once from dbo.sp_debcred_empresa, block B7 Notifications, line 1052, inside a region marked ref35 VP, capturing @w_return."}, {"id": "sp:sp_cerror", "name": "sp_cerror", "kind": "module", "language": "tsql-sybase", "loc": 1, "file": "(not in tree: cobis..sp_cerror)", "database": "cobis", "description": "cobis..sp_cerror is an external Sybase procedure whose source is not in the tree; only its call site is visible. Judging from its arguments, @t_from receiving @i_sp_name (the calling procedure's name) and @i_num receiving @w_num_error, it appears to record or raise a COBIS error identified by number, attributed to the originating procedure. It is called from dbo.sp_debcred_empresa, block B15, at the lbl_error exit (line 2152), immediately before the caller returns @w_num_error; the non-error branch instead sets @o_error and returns 0."}, {"id": "sp:sp_con_comision", "name": "sp_con_comision", "kind": "module", "language": "tsql-sybase", "loc": 1, "file": "(not in tree: db_biz_admempresa..sp_con_comision)", "database": "db_biz_admempresa"}, {"id": "sp:sp_con_confcontable", "name": "sp_con_confcontable", "kind": "module", "language": "tsql-sybase", "loc": 1, "file": "(not in tree: db_biz_admempresa..sp_con_confcontable)", "database": "db_biz_admempresa", "description": "db_biz_admempresa..sp_con_confcontable is an external Sybase procedure whose source is not in the tree; only its call sites are known. Judging from its arguments (@i_producto, @i_servicio, @i_tipoafec, @i_frm_pagcob, @i_canal, @i_tipcta, @i_moneda, @i_referencia, @i_empresa, and at B5 @i_concepto), it appears to look up the accounting configuration for a company debit, returning transaction code @o_trn and causal @o_cau; a return above 0 means no accounting configuration exists, and B5 defaults the causal to '512'. dbo.sp_debcred_empresa calls it in block B3 (line 322, else branch line 350) and block B5 (line 500)."}, {"id": "sp:sp_eventos", "name": "sp_eventos", "kind": "module", "language": "tsql-sybase", "loc": 1, "file": "(not in tree: cob_internet..sp_eventos)", "database": "cob_internet", "description": "cob_internet..sp_eventos is an external Sybase procedure whose source is not in the tree; only its call site is visible. Judging from its arguments, it appears to register a notification event (@i_operacion = 'I', an SMS channel and service via @w_canal_sms and @w_serv_sms, @i_desc_canal) for a company-account debit: it receives the deb     else if (e.target === n.id) neighbors.push({ id: e.source, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "←" });
  }
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.language ? " · " + esc(n.language) : ""}${n.loc ? " · " + n.loc.toLocaleString() + " LOC" : ""}</div>${n.description ? `<p class="desc">${esc(n.description)}<span class="cap">written by Claude from a source excerpt and the node's connections</span></p>` : ""}
    <div>${entrySet.has(n.id) ? '<span class="badge entry">entry point</span>' : ""}
      ${deadSet.has(n.id) ? '<span class="badge">dead-end candidate</span>' : ""}
      <span class="badge">fan-in ${fanIn.get(n.id) || 0}</span>
      <span class="badge">fan-out ${fanOut.get(n.id) || 0}</span></div>
    ${n.file ? `<h3>Source</h3><div class="meta">${esc(n.file)}</div>` : ""}
    ${neighbors.length ? `<h3>Connections (${neighbors.length})</h3>` +
      neighbors.slice(0, 40).map(x => `<span class="link" data-id="${esc(x.id)}">${x.dir} ${esc(byId.get(x.id)?.name || x.id)} <span class="kind">${esc(x.rel)}</span></span>`).join("") +
      (neighbors.length > 40 ? `<div class="meta">…and ${neighbors.length - 40} more</div>` : "") : ""}`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => { selected = null; renderSidebar(); requestDraw(); };
  sidebar.querySelectorAll(".link").forEach(el => el.onclick = () => {
    const t = byId.get(el.dataset.id);
    if (t) { selected = t.id; flyTo(t); renderSidebar(); requestDraw(); }
  });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
</html>
